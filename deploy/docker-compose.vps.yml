services:
  db:
    image: postgres:16-alpine
    container_name: restoflow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: restoflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: restoflow
    volumes:
      - restoflow_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restoflow -d restoflow"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://restoflow:${POSTGRES_PASSWORD}@db:5432/restoflow?schema=public
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_TRUST_HOST: "true"
      N8N_INTEGRATION_TOKEN: ${N8N_INTEGRATION_TOKEN}
      N8N_ORGANIZATION_ID: ${N8N_ORGANIZATION_ID}
    volumes:
      # Uploaded product photos live under public/uploads/products/ (see
      # src/lib/productImages.ts). Without this volume they'd only exist inside
      # the built image and vanish on the next `docker compose up --build`.
      - restoflow_uploads:/app/public/uploads

  n8n:
    image: n8nio/n8n:2.33.7
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      GENERIC_TIMEZONE: Asia/Manila
      TZ: Asia/Manila
      RESTOFLOW_BASE_URL: https://${RESTOFLOW_DOMAIN}
      RESTOFLOW_TOKEN: ${N8N_INTEGRATION_TOKEN}
      RESTOFLOW_PILOT_BRANCH: MAIN
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_OPERATIONS_CHAT_ID: ${TELEGRAM_OPERATIONS_CHAT_ID}
      TELEGRAM_OWNER_CHAT_ID: ${TELEGRAM_OWNER_CHAT_ID}
      TELEGRAM_MANAGER_CHAT_ID: ${TELEGRAM_MANAGER_CHAT_ID}
    volumes:
      - n8n_data:/home/node/.n8n
      - ../n8n/workflows:/files/workflows:ro

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      RESTOFLOW_DOMAIN: ${RESTOFLOW_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  restoflow_pg:
  restoflow_uploads:
  n8n_data:
  caddy_data:
  caddy_config:
